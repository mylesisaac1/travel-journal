<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Travel Entry</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1>Add Travel Entry</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add-entry.html" class="active">Add Entry</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="entry-counter">
            Entries: <span id="current-count">0</span>/<span id="max-entries">50</span>
        </div>

        <form id="travel-form">
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location" required>
            </div>
            
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" rows="4" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="image-url">Image URL:</label>
                <input type="url" id="image-url" placeholder="https://example.com/image.jpg">
                <div class="image-preview" id="image-preview"></div>
            </div>
            
            <button type="submit" id="submit-btn">Save Entry</button>
            <button type="button" id="cancel-btn">Cancel</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 My Travel Journal</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
